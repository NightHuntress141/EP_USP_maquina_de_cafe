name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Verificar código Python
        run: ruff check app tests

      - name: Auditar dependências fixadas
        run: pip-audit -r constraints.txt --no-deps --disable-pip

      - name: Rodar testes
        run: pytest -q
